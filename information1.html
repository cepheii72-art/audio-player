<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>시국수습에 관한 결의안</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-color: #f6f5f3;
            --text-color: #333333;
            --box-bg: #3c3836;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.45;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-color);
        }

        .title-box {
            background-color: var(--box-bg);
            color: #ffffff;
            text-align: center;
            padding: 130px 20px 60px 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -1px;
        }

        .content-wrapper {
            padding: 0 20px;
            padding-bottom: 60px;
        }

        .sub-title {
            text-align: center;
            font-size: 26px;
            font-weight: 500;
            margin-bottom: 40px;
            line-height: 1.4;
            letter-spacing: -0.5px;
        }

        .content-list {
            margin-bottom: 30px;
        }

        .content-list p, .content-footer p, .source-info p {
            font-size: 18px;
            margin: 0 0 10px 0;
            word-break: keep-all;
            letter-spacing: -0.5px;
        }
        
        .content-list p {
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .content-footer {
            margin-bottom: 50px;
        }
        
        .content-footer p {
            margin-bottom: 8px;
        }

        .source-info {
            color: #555555;
        }
        
        .source-info p {
            margin-bottom: 6px;
        }

        /* 모바일 대응 미디어 쿼리 */
        @media (max-width: 480px) {
            .title-box {
                padding: 80px 20px 40px 20px;
                margin-bottom: 25px;
            }
            h1 {
                font-size: 32px;
            }
            .sub-title {
                font-size: 20px;
                margin-bottom: 25px;
            }
            .content-list p, .content-footer p, .source-info p {
                font-size: 15px;
            }
        }

    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="title-box">
            <h1>시국수습에 관한 결의안</h1>
        </div>
        
        <div class="content-wrapper">
            <div class="sub-title">
                긴급동의안<br>
                시국수습결의안
            </div>
            
            <div class="content-list">
                <p>1_이승만 대통령은 즉시 하야할 것</p>
                <p>2_3·15 대통령 및 부통령 선거는 무효로 하고 재선거를 실시한다.</p>
                <p>3_과도내각하에 완전한 내각책임제(의원내각제)로 개헌을 단행하고</p>
                <p>4_개헌통과 후 민의원을 해산하고 총선거를 즉시 실시한다.</p>
            </div>
            
            <div class="content-footer">
                <p>위와 같이 결의함. 즉시.</p>
                <p>이유 읽는 것으로 설명을 대신함</p>
                <p>단기 4293년(서기 1960년) 4월 26일</p>
            </div>
            
            <div class="source-info">
                <p>※ 의안정보 (출처: 국회의안정보시스템)</p>
                <p>- 제안자: 이철승의원 외 15인</p>
                <p>- 제안일자: 1960.4.26.</p>
                <p>- 처리결과: 원안가결</p>
            </div>
        </div>
    </div>

    <script>
        // GSAP Animations
        window.addEventListener('DOMContentLoaded', () => {
            const tl = gsap.timeline({ defaults: { ease: "power3.out", duration: 0.8 } });

            tl.from(".title-box", { y: -20, opacity: 0 })
              .from(".sub-title", { y: 20, opacity: 0 }, "-=0.4")
              .from(".content-list p", { y: 15, opacity: 0, stagger: 0.1 }, "-=0.4")
              .from(".content-footer p", { y: 15, opacity: 0, stagger: 0.1 }, "-=0.4")
              .from(".source-info p", { y: 15, opacity: 0, stagger: 0.1 }, "-=0.4");
        });
    </script>
</body>
</html>
